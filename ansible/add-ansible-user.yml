- name: Prep VPS for Ansible
  hosts: vps
  vars:
    ansible_user: root
  tasks:
    - name: Create ansible group
      ansible.builtin.group:
        name: ansible
        state: present
        gid: 1000
    - name: Create ansible user
      ansible.builtin.user:
        name: ansible
        state: present
        uid: 1000
        group: ansible
        create_home: true
        home: /home/ansible
        shell: /bin/bash
        comment: "Ansible service account"
        force: true
    - name: Add ansible authorized SSH key
      ansible.posix.authorized_key:
        user: ansible
        state: present
        key: "{{ lookup('file', 'keys/ansible_key.pub') }}"
    - name: Add ansible user to sudoers
      ansible.builtin.copy:
        src: files/sudoers-ansible
        dest: /etc/sudoers.d/ansible
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -csf %s
